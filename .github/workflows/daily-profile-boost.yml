name: Daily Multi-Platform Profile Rank Booster

on:
  schedule:
    # Morning window: Trigger at 8:45 AM IST (3:15 AM UTC)
    - cron: '15 3 * * *'
    # Afternoon window: Trigger at 2:15 PM IST (8:45 AM UTC)
    - cron: '45 8 * * *'

  # Manual on-demand trigger (from GitHub Mobile App or Web)
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target Platform to refresh'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - naukri
          - instahyre
          - wellfound
          - cutshort

permissions:
  contents: read

jobs:
  boost-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Install Playwright Firefox
        run: npx playwright install --with-deps firefox

      - name: Restore Auth State Secrets
        run: |
          mkdir -p auth
          echo "${{ secrets.NAUKRI_AUTH_STATE }}" | base64 -d > auth/naukri-state.json 2>/dev/null || true
          echo "${{ secrets.INSTAHYRE_AUTH_STATE }}" | base64 -d > auth/instahyre-state.json 2>/dev/null || true
          echo "${{ secrets.WELLFOUND_AUTH_STATE }}" | base64 -d > auth/wellfound-state.json 2>/dev/null || true
          echo "${{ secrets.CUTSHORT_AUTH_STATE }}" | base64 -d > auth/cutshort-state.json 2>/dev/null || true

      - name: Jitter Delay (Anti-bot natural window 0-25 mins)
        if: github.event_name == 'schedule'
        run: |
          # Random sleep between 60s and 1500s (0 to 25 mins)
          DELAY=$(( (RANDOM % 1440) + 60 ))
          echo "Simulating natural human start. Sleeping for ${DELAY} seconds..."
          sleep ${DELAY}

      - name: Run Multi-Platform Rank Booster
        run: npx tsx scripts/update-all.ts
        env:
          HEADLESS: 'true'

      - name: Upload Debug Artifacts (on failure or success)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-boost-screenshots
          path: artifacts/
          retention-days: 7
