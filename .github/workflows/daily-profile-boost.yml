name: Daily Multi-Platform Profile Rank Booster

on:
  schedule:
    # 1. MORNING SHIFT (India Golden Window):
    # Odd-minute schedule (7:07 AM IST / 1:37 AM UTC) to bypass GitHub Actions traffic jam
    - cron: '37 1 * * *'

    # 2. AFTERNOON SHIFT (Post-Lunch & India/Wellfound Overlap):
    # Odd-minute schedule (12:53 PM IST / 7:23 AM UTC)
    - cron: '23 7 * * *'

    # 3. EVENING SHIFT (US & Europe Founder Morning Window):
    # Odd-minute schedule (5:37 PM IST / 12:07 PM UTC) -> Runs Wellfound
    - cron: '07 12 * * *'

  # Manual on-demand trigger (from GitHub Mobile App or Web)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - morning
          - afternoon
          - evening

permissions:
  contents: read

jobs:
  boost-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-firefox-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Firefox
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox

      - name: Restore Auth State Secrets
        run: |
          mkdir -p auth
          echo "${{ secrets.NAUKRI_AUTH_STATE }}" | base64 -d > auth/naukri-state.json 2>/dev/null || true
          echo "${{ secrets.INSTAHYRE_AUTH_STATE }}" | base64 -d > auth/instahyre-state.json 2>/dev/null || true
          echo "${{ secrets.WELLFOUND_AUTH_STATE }}" | base64 -d > auth/wellfound-state.json 2>/dev/null || true
          echo "${{ secrets.CUTSHORT_AUTH_STATE }}" | base64 -d > auth/cutshort-state.json 2>/dev/null || true
          echo "${{ secrets.HIRIST_AUTH_STATE }}" | base64 -d > auth/hirist-state.json 2>/dev/null || true
          echo "${{ secrets.FOUNDIT_AUTH_STATE }}" | base64 -d > auth/foundit-state.json 2>/dev/null || true
          echo "${{ secrets.SHINE_AUTH_STATE }}" | base64 -d > auth/shine-state.json 2>/dev/null || true

      - name: Determine Mode & Natural Jitter Delay (Anti-Bot Window)
        run: |
          # If manual dispatch, use input; else determine from UTC hour
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_MODE="${{ github.event.inputs.mode }}"
            echo "TARGET_MODE=${SELECTED_MODE}" >> $GITHUB_ENV
            echo "Manual trigger mode: ${SELECTED_MODE} (No jitter delay)"
          else
            # Calculate current IST Time (UTC + 5:30)
            UTC_H=$(date -u +%-H)
            UTC_M=$(date -u +%-M)
            TOTAL_MIN=$(( UTC_H * 60 + UTC_M + 330 ))
            IST_H=$(( (TOTAL_MIN / 60) % 24 ))
            IST_M=$(( TOTAL_MIN % 60 ))
            echo "Current IST Time: ${IST_H}:${IST_M} (UTC: ${UTC_H}:${UTC_M})"

            # Fail-closed night killswitch: abort delayed runs between 9:00 PM (21:00) and 6:30 AM IST
            if [ "$IST_H" -ge 21 ] || [ "$IST_H" -lt 6 ] || ([ "$IST_H" -eq 6 ] && [ "$IST_M" -lt 30 ]); then
              echo "🛑 NIGHT-TIME DETECTED IN INDIA (${IST_H}:${IST_M} IST)."
              echo "GitHub cron delay resulted in an off-hours execution. Aborting to prevent useless night rank boosts."
              echo "SKIP_RUN=true" >> $GITHUB_ENV
              exit 0
            fi

            # Automated cron - determine shift based on live IST time
            if [ "$IST_H" -ge 6 ] && [ "$IST_H" -lt 12 ]; then
              echo "TARGET_MODE=morning" >> $GITHUB_ENV
            elif [ "$IST_H" -ge 12 ] && [ "$IST_H" -lt 16 ]; then
              echo "TARGET_MODE=afternoon" >> $GITHUB_ENV
            else
              echo "TARGET_MODE=evening" >> $GITHUB_ENV
            fi
            
            # Natural human jitter delay: 60s to 600s (1 to 10 minutes)
            DELAY=$(( (RANDOM % 540) + 60 ))
            echo "Simulating natural human timing. Sleeping for ${DELAY} seconds..."
            sleep ${DELAY}
          fi

      - name: Run Targeted Multi-Platform Rank Booster
        if: env.SKIP_RUN != 'true'
        run: npx tsx scripts/update-all.ts "${{ env.TARGET_MODE }}"
        env:
          HEADLESS: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload Debug Artifacts (on failure or success)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-boost-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
