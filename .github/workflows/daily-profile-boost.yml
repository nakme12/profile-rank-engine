name: Daily Multi-Platform Profile Rank Booster

on:
  schedule:
    # 1. MORNING SHIFT (India Golden Window):
    # Triggers at 7:45 AM IST (2:15 AM UTC) -> Runs Naukri, Instahyre, Cutshort, Hirist, Foundit, Shine
    - cron: '15 2 * * *'

    # 2. AFTERNOON SHIFT (Post-Lunch & India/Wellfound Overlap):
    # Triggers at 1:15 PM IST (7:45 AM UTC) -> Runs Naukri, Instahyre, Cutshort, Hirist, Foundit, Shine + Wellfound
    - cron: '45 7 * * *'

    # 3. EVENING SHIFT (US & Europe Founder Morning Window):
    # Triggers at 5:45 PM IST (12:15 PM UTC) -> Runs Wellfound
    - cron: '15 12 * * *'

  # Manual on-demand trigger (from GitHub Mobile App or Web)
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution mode'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - morning
          - afternoon
          - evening

permissions:
  contents: read

jobs:
  boost-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-firefox-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Firefox
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox

      - name: Restore Auth State Secrets
        run: |
          mkdir -p auth
          echo "${{ secrets.NAUKRI_AUTH_STATE }}" | base64 -d > auth/naukri-state.json 2>/dev/null || true
          echo "${{ secrets.INSTAHYRE_AUTH_STATE }}" | base64 -d > auth/instahyre-state.json 2>/dev/null || true
          echo "${{ secrets.WELLFOUND_AUTH_STATE }}" | base64 -d > auth/wellfound-state.json 2>/dev/null || true
          echo "${{ secrets.CUTSHORT_AUTH_STATE }}" | base64 -d > auth/cutshort-state.json 2>/dev/null || true
          echo "${{ secrets.HIRIST_AUTH_STATE }}" | base64 -d > auth/hirist-state.json 2>/dev/null || true
          echo "${{ secrets.FOUNDIT_AUTH_STATE }}" | base64 -d > auth/foundit-state.json 2>/dev/null || true
          echo "${{ secrets.SHINE_AUTH_STATE }}" | base64 -d > auth/shine-state.json 2>/dev/null || true

      - name: Determine Mode & Natural Jitter Delay (Anti-Bot Window)
        run: |
          # If manual dispatch, use input; else determine from UTC hour
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            SELECTED_MODE="${{ github.event.inputs.mode }}"
            echo "TARGET_MODE=${SELECTED_MODE}" >> $GITHUB_ENV
            echo "Manual trigger mode: ${SELECTED_MODE} (No jitter delay)"
          else
            # Automated cron - determine shift
            HOUR=$(date -u +%H)
            if [ "$HOUR" -ge 1 ] && [ "$HOUR" -le 4 ]; then
              echo "TARGET_MODE=morning" >> $GITHUB_ENV
            elif [ "$HOUR" -ge 6 ] && [ "$HOUR" -le 10 ]; then
              echo "TARGET_MODE=afternoon" >> $GITHUB_ENV
            else
              echo "TARGET_MODE=evening" >> $GITHUB_ENV
            fi
            
            # Natural human jitter delay: 60s to 900s (1 to 15 minutes)
            DELAY=$(( (RANDOM % 840) + 60 ))
            echo "Simulating natural human timing. Sleeping for ${DELAY} seconds..."
            sleep ${DELAY}
          fi

      - name: Run Targeted Multi-Platform Rank Booster
        run: npx tsx scripts/update-all.ts "${{ env.TARGET_MODE }}"
        env:
          HEADLESS: 'true'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Upload Debug Artifacts (on failure or success)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile-boost-screenshots
          path: artifacts/*.png
          if-no-files-found: ignore
